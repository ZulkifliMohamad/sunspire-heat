<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunspire Heat — Open-World Crime in Sunspire</title>
<link rel="icon" href="./favicon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f5efe2; display: none; }
  .panel { position: absolute; background: rgba(16, 18, 24, 0.72); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(2px); }
  #top-left { top: 14px; left: 14px; }
  #stars { font-size: 26px; letter-spacing: 3px; line-height: 1; }
  #cash { font-size: 24px; font-weight: 700; color: #ffd24d; margin-top: 4px; }
  #mission { top: 14px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 46vw; }
  #mission-name { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ffc21c; }
  #objective { font-size: 15px; margin-top: 3px; }
  #top-right { top: 14px; right: 14px; padding: 6px; }
  #minimap { display: block; width: 168px; height: 168px; border-radius: 6px; }
  #bottom-left { bottom: 16px; left: 14px; width: 220px; }
  #health-text { font-size: 13px; font-weight: 700; }
  #health-bar { height: 10px; background: rgba(255,255,255,0.18); border-radius: 5px; margin-top: 5px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; border-radius: 5px; }
  #bottom-right { bottom: 16px; right: 14px; font-size: 26px; font-weight: 700; text-align: right; }
  #prompt { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #e8ddc2; background: rgba(16,18,24,0.6); padding: 7px 14px; border-radius: 8px; }
  #banner { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; color: #ffe9a8; background: rgba(16,18,24,0.75); padding: 9px 18px; border-radius: 8px; max-width: 70vw; text-align: center; transition: opacity 0.4s; }
  #toast { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(16,18,24,0.8); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity 0.4s; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); display: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,0.9); }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { left: 0; top: 10px; width: 22px; height: 2px; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 8, 6, 0.55); pointer-events: none; }
  #overlay-card { max-width: 640px; margin: 0 20px; background: rgba(16, 14, 10, 0.88); border: 1px solid rgba(255, 194, 28, 0.45); border-radius: 14px; padding: 30px 36px; text-align: center; color: #f5efe2; }
  #overlay-title { font-size: 44px; font-weight: 800; letter-spacing: 3px; color: #ffc21c; margin: 0 0 12px; }
  #overlay-body { font-size: 16px; line-height: 1.55; color: #e8ddc2; }
  #overlay-prompt { margin-top: 20px; font-size: 17px; font-weight: 700; color: #ffd24d; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Sunspire Heat: an open-world crime game. Drive, steal cars, outrun the police and run missions across Sunspire."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <div class="panel" id="top-left"><div id="stars">☆☆☆☆☆</div><div id="cash">$0</div></div>
  <div class="panel" id="mission"><div id="mission-name">Sunspire</div><div id="objective"></div></div>
  <div class="panel" id="top-right"><canvas id="minimap" width="168" height="168"></canvas></div>
  <div class="panel" id="bottom-left"><div id="health-text">HP 100</div><div id="health-bar"><div id="health-fill"></div></div></div>
  <div class="panel" id="bottom-right"><span id="speed"></span></div>
  <div id="prompt"></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="crosshair"></div>
</div>
<div id="overlay"><div id="overlay-card"><h1 id="overlay-title">SUNSPIRE HEAT</h1><p id="overlay-body"></p><p id="overlay-prompt"></p></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
